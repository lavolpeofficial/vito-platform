name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, generate, test, gate and build
    runs-on: [self-hosted, linux, x64, aoe-heavy]
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vito_operator_bridge_ci
          POSTGRES_USER: vito_ci
          POSTGRES_PASSWORD: vito_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vito_ci -d vito_operator_bridge_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize bounded runner workspace
        shell: bash
        run: |
          set -euo pipefail
          current="$RUNNER_TEMP/vito-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cache="$RUNNER_TEMP/vito-ci-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          for stale in "$RUNNER_TEMP"/vito-ci-*; do
            [ -e "$stale" ] || continue
            [ "$stale" = "$current" ] && continue
            [ "$stale" = "$cache" ] && continue
            rm -rf -- "$stale"
          done

          mkdir -p "$current" "$cache" "$cache/corepack"
          {
            echo "VITO_CI_TEMP=$current"
            echo "VITO_CI_CACHE=$cache"
            echo "TMPDIR=$current"
            echo "TMP=$current"
            echo "TEMP=$current"
            echo "XDG_CACHE_HOME=$cache"
            echo "COREPACK_HOME=$cache/corepack"
          } >> "$GITHUB_ENV"

          df -h "$RUNNER_TEMP"
          available_kb="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          if [ "$available_kb" -lt 1048576 ]; then
            echo "Runner has less than 1 GiB free after bounded VITO temp cleanup." >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Persist pnpm on PATH
        shell: bash
        run: |
          test -n "$PNPM_HOME"
          export PATH="$PNPM_HOME:$PATH"
          echo "$PNPM_HOME" >> "$GITHUB_PATH"
          command -v pnpm
          test "$(pnpm --version)" = "11.17.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Validate clean PostgreSQL migration chain
        env:
          DATABASE_URL: postgresql://vito_ci:vito_ci@127.0.0.1:5432/vito_operator_bridge_ci
        run: pnpm prisma:migrate:deploy

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://vito_ci:vito_ci@127.0.0.1:5432/vito_operator_bridge_ci
        run: pnpm test

      - name: Run mandatory Operator Bridge PostgreSQL gate
        env:
          OPERATOR_BRIDGE_TEST_DATABASE_URL: postgresql://vito_ci:vito_ci@127.0.0.1:5432/vito_operator_bridge_ci
        run: pnpm --filter @vito/api test:operator-bridge:pg

      - name: Run mandatory composed auth and Operator Bridge E2E gate
        env:
          DATABASE_URL: postgresql://vito_ci:vito_ci@127.0.0.1:5432/vito_operator_bridge_ci
          JWT_SECRET: ci-only-operator-bridge-jwt-secret
          OPERATOR_BRIDGE_E2E_ONLY: "true"
          OPERATOR_BRIDGE_EXPOSURE: internal
          SENSITIVE_PAYLOAD_TTL_HOURS: "72"
        run: pnpm --filter @vito/api test:e2e --runInBand --testNamePattern="VITO-OB-001 Operator Bridge authorization and composed API"

      - name: Run mandatory JARVIS Command Bus auth boundary E2E gate
        env:
          DATABASE_URL: postgresql://vito_ci:vito_ci@127.0.0.1:5432/vito_operator_bridge_ci
          JWT_SECRET: ci-only-command-bus-jwt-secret
          OPERATOR_BRIDGE_EXPOSURE: internal
          SENSITIVE_PAYLOAD_TTL_HOURS: "72"
        run: pnpm --filter @vito/api test:e2e --runInBand --runTestsByPath test/command-bus.e2e-spec.ts

      - name: Build API
        run: pnpm build

      - name: Clean bounded runner workspace
        if: always()
        shell: bash
        run: |
          rm -rf -- "${VITO_CI_TEMP:-}" "${VITO_CI_CACHE:-}"
