name: Self-hosted Runner Probe

on:
  push:
    branches:
      - feature/vito-self-learning-reflection-v1
    paths:
      - '.github/workflows/self-hosted-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, x64, aoe-governance]
    timeout-minutes: 5
    steps:
      - name: Identify runner
        run: |
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          uname -a
          id
          df -h /
