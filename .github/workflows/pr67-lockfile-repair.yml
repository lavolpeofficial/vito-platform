name: PR67 Lockfile Repair

on:
  push:
    branches:
      - feature/vito-pdf-knowledge-harvester-v1

permissions:
  contents: write

jobs:
  repair:
    runs-on: [self-hosted, linux, x64, aoe-heavy]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vito-pdf-knowledge-harvester-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - name: Regenerate lockfile with CI pnpm
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile repair
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already consistent"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(ci): regenerate pnpm lockfile with pnpm 11.17"
          git push origin HEAD:feature/vito-pdf-knowledge-harvester-v1
